
services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-registry:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      # Đặt tên host để các service khác gọi đúng tên này
      eureka.instance.hostname: service-registry
      # Tắt chế độ tự bảo vệ để đỡ hiện dòng chữ đỏ (chỉ dùng khi Dev)
      eureka.client.register-with-eureka: "false"
      eureka.client.fetch-registry: "false"
      eureka.client.serviceUrl.defaultZone: http://service-registry:8761/eureka/
    networks:
      - microservice-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      eureka.client.serviceUrl.defaultZone: http://service-registry:8761/eureka/
      SERVER_PORT: 8080
      eureka.instance.prefer-ip-address: "true"
    depends_on:
      - service-registry
    networks:
      - microservice-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      eureka.client.serviceUrl.defaultZone: http://service-registry:8761/eureka/
      eureka.instance.prefer-ip-address: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy # Chờ DB thật sự sẵn sàng mới chạy service
      service-registry:
        condition: service_started
    networks:
      - microservice-network

  product-service:
